name: Resline checks

# Checks that only the resline fork needs. Kept in its own file so rebasing
# onto a new upstream tag never conflicts with upstream's workflows.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-urls:
    name: No upstream download addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/resline/check-upstream-urls.sh

  version-marker:
    name: xray version carries the resline marker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build xray as release.yml does
        run: go build -o xray -trimpath -buildvcs=false -ldflags="-X github.com/xtls/xray-core/core.build=$(git describe --always --dirty)" ./main
      - name: Check version output (and the tag, on a tag push)
        run: .github/resline/check-version-marker.sh ./xray "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
